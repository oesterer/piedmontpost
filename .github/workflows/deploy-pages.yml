name: Deploy search website

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'manifest.json'
      - 'indexes/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/configure-pages@v6
      - name: Prepare public website only
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          cp index.html style.css app.js search.js pdf-links.js progressive-search.js search-worker.js manifest.json "$RUNNER_TEMP/pages/"
          cp -R indexes "$RUNNER_TEMP/pages/indexes"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
