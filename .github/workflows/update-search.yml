name: Update newspaper search

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Re-download and re-extract every issue (normally leave unchecked)
        type: boolean
        default: false
      deploy:
        description: Deploy the validated search to GitHub Pages
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'archive-search/public/**'
      - '.github/workflows/update-search.yml'
  schedule:
    # UTC: daily 07:17 PST / 08:17 PDT, plus hourly Wednesday release checks.
    - cron: '17 15 * * *'
    - cron: '17 16-23 * * 3'
    - cron: '17 0-2 * * 4'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: newspaper-search-update
  cancel-in-progress: false

jobs:
  update:
    # Manual runs on other branches must never publish or overwrite production.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        working-directory: archive-search
    env:
      DEPLOY: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: archive-search/package-lock.json
      - name: Check configuration and tracked incremental cache
        env:
          PIEDMONT_ARCHIVE_PASSWORD: ${{ secrets.PIEDMONT_ARCHIVE_PASSWORD }}
        run: |
          test -n "$PIEDMONT_ARCHIVE_PASSWORD" || { echo '::error::Set the PIEDMONT_ARCHIVE_PASSWORD repository secret.'; exit 1; }
          git ls-files --error-unmatch cache/manifest.json >/dev/null || { echo '::error::Commit the incremental cache before running this workflow.'; exit 1; }
      - run: npm ci
      - run: npx playwright install chromium
      - name: Run tests
        run: npm test
      - name: Discover and index online issues
        id: index
        continue-on-error: true
        env:
          PIEDMONT_ARCHIVE_PASSWORD: ${{ secrets.PIEDMONT_ARCHIVE_PASSWORD }}
          REBUILD: ${{ inputs.rebuild == true }}
        run: |
          if [ "$REBUILD" = true ]; then
            npm run index:archive -- --rebuild
          else
            npm run index:archive
          fi
      - name: Verify every published page against the cache
        id: verify
        run: npm run verify:indexes
      - name: Check whether production needs updating
        id: publication
        if: steps.index.outcome == 'success' && env.DEPLOY == 'true'
        run: node scripts/deployment-state.mjs check
      - name: Configure GitHub Pages
        if: steps.publication.outputs.changed == 'true'
        uses: actions/configure-pages@v6
      - name: Prepare public-only site with the existing URL layout
        if: steps.publication.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/pages/archive-search/public"
          cp -R public/. "$RUNNER_TEMP/pages/archive-search/public/"
      - name: Upload GitHub Pages artifact
        if: steps.publication.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy static files to GitHub Pages
        id: deploy
        if: steps.publication.outputs.changed == 'true'
        uses: actions/deploy-pages@v5
      - name: Record successful deployment
        if: steps.deploy.outcome == 'success'
        run: node scripts/deployment-state.mjs record
      - name: Save verified cache and generated indexes
        # Persist successful issues even when another PDF or deployment failed.
        # Bot pushes do not trigger this workflow or a branch-based Pages build.
        if: always() && steps.verify.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cache/manifest.json cache/issues public
          if [ -f cache/deployment.json ]; then git add cache/deployment.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update newspaper archive search [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Write run summary
        if: always()
        env:
          INDEX_OUTCOME: ${{ steps.index.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo '## Newspaper search update' >> "$GITHUB_STEP_SUMMARY"
          echo "- Indexing: ${INDEX_OUTCOME:-not run}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verification: ${VERIFY_OUTCOME:-not run}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: ${DEPLOY_OUTCOME:-not needed or disabled}" >> "$GITHUB_STEP_SUMMARY"
          node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync("public/manifest.json")); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- Archive: ${m.issueCount} issues, ${m.pageCount} pages\n- Latest issue: ${m.issues[0].date}\n`);'
      - name: Report indexing failure
        if: always() && steps.index.outcome == 'failure'
        run: |
          echo '::error::Some issues could not be indexed. Verified progress was saved; production was not deployed. Rerun to retry missing PDFs.'
          exit 1
