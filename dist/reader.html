<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Read an issue · Piedmont Post</title><link rel="stylesheet" href="style.css"><style>body{background:#e7e9e2}.reader-top{max-width:1200px;margin:auto;padding:18px 20px;display:flex;justify-content:space-between;gap:15px;align-items:center}.reader-top a{color:var(--ink);font-size:12px}.reader-brand{font:bold 26px Georgia,serif}.toolbar{background:var(--paper);border-block:1px solid var(--line);padding:15px 20px;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}.toolbar button{background:transparent;border:1px solid var(--line);padding:9px 14px;color:var(--ink)}.toolbar button:disabled{opacity:.4;cursor:default}.toolbar input{padding:8px;width:64px;flex:none;font-size:13px}#page-image{display:block;width:100%;height:auto;background:white;box-shadow:0 4px 25px #24372f20}.sheet{max-width:1000px;margin:24px auto;padding:0 16px}.reader-meta{font-size:12px}.reader-links{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:12px;margin:15px}.reader-links a{color:var(--ink)}details{max-width:970px;margin:20px auto;padding:16px;background:var(--paper);font-size:13px}#text{white-space:pre-wrap;line-height:1.7}#reader-status{text-align:center;font-size:12px;color:var(--muted)}@media(max-width:600px){.reader-brand{font-size:22px}.toolbar{gap:10px}.reader-meta{width:100%;text-align:center}}</style></head><body><div class="reader-top"><a id="back" href="./">← Back to archive</a><span class="reader-brand">Piedmont Post</span><a id="pdf-top">Open PDF ↗</a></div><div class="toolbar"><span class="reader-meta" id="date">Loading issue…</span><button id="prev" disabled aria-label="Previous page">← Previous</button><form id="jump"><label for="page-number">Page </label><input id="page-number" type="number" min="1" value="1"><span id="count"></span></form><button id="next" disabled aria-label="Next page">Next →</button></div><div class="reader-links"><a id="pdf">Open this page in the original PDF ↗</a><a id="download" download>Download issue</a></div><p id="reader-status" role="status" aria-live="polite"></p><div class="sheet"><img id="page-image" alt="" hidden></div><details><summary>Read extracted page text</summary><p id="text"></p></details><script type="module" src="reader.js"></script></body></html>
