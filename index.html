<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search past issues of the Piedmont Post by name, topic, or date.">
  <title>Piedmont Post · Search the Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="archive-page">
    <section class="search-panel" aria-label="Archive search">
      <form id="search-form">
        <div class="search-panel-heading">
          <label for="query">Search the newspaper</label>
          <button id="browse-all" class="button button-outline" type="button">Browse All Issues</button>
        </div>
        <div class="search-row">
          <input id="query" type="search" placeholder="Names, places, and stories…" autocomplete="off">
          <button id="submit" class="button button-primary" type="submit" disabled>Search Archive</button>
        </div>
        <div class="filters">
          <label for="year"><span class="filter-label">Year</span><span class="select-shell"><select id="year"><option value="">All years</option></select></span></label>
          <label for="issue"><span class="filter-label">Issue</span><span class="select-shell"><select id="issue"><option value="">All issues</option></select></span></label>
          <label for="mode"><span class="filter-label">Match</span><span class="select-shell"><select id="mode"><option value="words">All words</option><option value="phrase">Exact phrase</option></select></span></label>
          <label for="order"><span class="filter-label">Order</span><span class="select-shell"><select id="order"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></span></label>
        </div>
      </form>
      <div class="suggestions" aria-label="Suggested searches">
        <span class="suggestions-label">TRY A SEARCH</span>
        <button type="button" data-query="Bonnie Tam">Bonnie Tam</button>
        <button type="button" data-query="City Council">City Council</button>
        <button type="button" data-query="Harvest Festival">Harvest Festival</button>
      </div>
    </section>

    <section class="collection" aria-busy="false" id="collection">
      <div class="section-heading">
        <h2 id="results-title">Browse issues</h2>
        <span id="status" role="status" aria-live="polite">Loading archive…</span>
      </div>
      <div class="search-progress">
        <span id="progress" role="status" aria-live="polite"></span>
        <button id="stop" class="button button-outline" type="button" hidden>Stop search</button>
      </div>
      <div id="error" role="alert" hidden></div>
      <div id="results"></div>
      <button id="more" class="button button-outline" type="button" hidden>Show more results</button>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
